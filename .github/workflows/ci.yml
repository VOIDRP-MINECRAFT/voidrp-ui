name: Build and tests

# The invariant of the project: the server must predict the client's pen to the pixel, and
# what checks that is the tests, not a player's eyes. So they run on every push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Compiling against Paper 26.2 needs JDK 25; Gradle fetches it itself
      # (foojay-resolver in settings.gradle.kts), so any recent one will do here.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Tests
        run: ./gradlew test

      # The icon-width check is skipped: we have no right to distribute a client jar.
      - name: Build
        run: ./gradlew shadowJar

      - uses: actions/upload-artifact@v6
        with:
          name: voidrp-ui
          path: build/libs/*-all.jar
