# Все строки, которые видит игрок. Меняйте под свой сервер — поддерживается
# форматирование MiniMessage (<gray>, <#8b7bff>, <bold> и прочее).
#
# Это русский набор по умолчанию. Какой из них попадёт в messages.yml при первом запуске,
# решает language в config.yml.

pack:
  # Подпись в окне запроса ресурспака.
  prompt: "<aqua>Интерфейсы сервера</aqua>"
  # Игрок отклонил пак или он не скачался, а страница уже нужна.
  missing: "<red>Интерфейс не загружен.</red> <gray>Примите ресурспак — он отправлен ещё раз — и повторите. Без него окна не нарисовать.</gray>"
  # После /vui pack.
  sent: "<green>Отправил ресурспак — примите его в клиенте.</green>"
  # Пак негде взять: ни pack.url, ни встроенной раздачи.
  unavailable: "<red>Ресурспак не настроен.</red> <gray>Сообщите администратору сервера.</gray>"

page:
  opened: "<gray>Прицел — курсор, ЛКМ — нажать, Shift — назад.</gray>"
  closed: "<gray>Закрыто.</gray>"

# Страница настройки экрана — единственная, которую видит каждый игрок.
screen-page:
  eyebrow: "Настройка экрана · один раз"
  title: "Подгоните рамку под края экрана"
  text: "Размер окна игра серверу не сообщает, поэтому формат задаёте вы — один раз. Уголки должны сойтись с углами экрана."
  narrower: "←  уже"
  wider: "шире  →"
  fine: "Точная подгонка — по 8 единиц за нажатие"
  invisible: "Рамки не видно? Значит экран уже, чем думает сервер — жмите «уже»."
  done: "Готово"
  server: "Как на сервере"

screen:
  # /vui screen — игрок сообщает, какой формы у него экран.
  current: "<gray>Ваш экран: <white><screen></white>. Сменить: <white>/vui screen 16:9</white> · список: <white>/vui screen</white></gray>"
  list: "<gray>Форматы: <white><list></white>. Можно и разрешением: <white>/vui screen 1920x1080</white>.</gray>"
  set: "<green>Экран: <white><screen></white>.</green> <gray>Страница перерисована под него.</gray>"
  auto: "<green>Формат экрана сброшен на серверный (<white><screen></white>).</green>"
  unknown: "<red>Не понял формат.</red> <gray>Примеры: <white>16:9</white>, <white>4:3</white>, <white>1920x1080</white>, <white>auto</white>.</gray>"

# The game's own text dialog, which a page borrows to take typing.
prompt:
  submit: "Готово"
  cancel: "Отмена"

command:
  players-only: "<red>Команда только для игроков.</red>"
  no-permission: "<red>Недостаточно прав.</red>"
  usage: "<gray>/vui open · /vui screen · /vui pack · /vui help</gray>"
  usage-debug: "<gray>/vui debug bench|stats|clicks|sens|cursor|shape|text|shot|sweep|clear</gray>"
  unknown: "<red>Неизвестная команда.</red> <gray>/vui help</gray>"
