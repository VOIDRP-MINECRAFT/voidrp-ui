# Внешний вид интерфейсов. Всё необязательно: что не указано — берётся из темы VoidRP.
# Цвета в формате #rrggbb.

# Фон страницы и текст
bg: "#05060D"
surface: "#0F1526"
ink: "#EAF0FF"
ink-soft: "#AEB9D6"
ink-dim: "#6B779A"
# Оттенок всех рамок и разделителей
line: "#96A8DC"

# Акценты
accent: "#8B7BFF"
accent-soft: "#A78BFA"
accent-second: "#D946EF"
green: "#34D399"
gold: "#FBBF24"
red: "#FB7185"

# Разрядка маленьких подписей капсом
tracking: 2

# Кегли, в единицах холста (холст — 1820×1024)
text:
  caption: 12
  body: 14
  lead: 16
  h3: 20
  h2: 28
  h1: 40

# Скругления
radius:
  sm: 8
  md: 12
  lg: 16
  xl: 20
