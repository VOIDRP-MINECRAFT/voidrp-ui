# Ember — warm dark: charcoal with an orange fire in it.

bg: "#0C0705"
surface: "#17100C"
ink: "#FBEFE6"
ink-soft: "#D2B7A4"
ink-dim: "#8C7565"
line: "#C9A184"

accent: "#F97316"
accent-soft: "#FB923C"
accent-second: "#E11D48"
green: "#65A30D"
gold: "#FACC15"
red: "#EF4444"

tracking: 2

text:
  micro: 10
  caption: 12
  body: 14
  lead: 16
  h3: 20
  h2: 28
  h1: 40

radius:
  sm: 8
  md: 12
  lg: 16
  xl: 20

# The typeface. Left out, the interface is set in Inter, which the jar carries. To use
# another, put its TrueType files in plugins/VoidRpUI/fonts/ and name them here; a weight
# left empty is drawn from the regular file. Read once at start, because the letters are
# baked into the pack — restart the server after changing it.
#
# font:
#   regular: "MyFace-Regular.ttf"
#   semibold: ""
#   bold: "MyFace-Bold.ttf"
#   # A face drawn on a grid of pixels: no smoothing, so its edges stay sharp.
#   pixel: true
#   # Sizes to bake, in canvas units. A pixel face is crisp only at whole multiples of its
#   # own pixel. Set the type sizes under `text` above to these too.
#   sizes: [8, 16, 24, 32]
