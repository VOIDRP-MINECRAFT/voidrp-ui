name: VoidRpUI
version: '${version}'
main: ru.voidrp.ui.VoidRpUiPlugin
api-version: '1.21'
# Loaded after PacketEvents where it is present, so that the aim can be read straight off
# the packets. Without this the order is whatever the server happens to choose, and enabling
# first means the check for it fails and the cursor falls back to once a tick.
softdepend: [packetevents]
author: VoidRP
website: https://void-rp.ru
description: Real interfaces on a vanilla client. Open source, MIT.
commands:
  vui:
    description: VoidRP UI interfaces
    usage: /vui open | /vui screen | /vui pack | /vui help
permissions:
  voidrp.ui.use:
    description: Open the demo page
    default: true
  voidrp.ui.debug:
    description: Interface debugging tools
    default: op
