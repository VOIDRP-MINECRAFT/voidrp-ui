name: VoidRpUI
version: '${version}'
main: ru.voidrp.ui.VoidRpUiPlugin
api-version: '1.21'
author: VoidRP
website: https://void-rp.ru
description: Настоящие интерфейсы на ванильном клиенте. Открытый код, MIT.
commands:
  vui:
    description: Интерфейсы VoidRP UI
    usage: /vui open | /vui pack | /vui help
permissions:
  voidrp.ui.use:
    description: Открывать демонстрационную страницу
    default: true
  voidrp.ui.debug:
    description: Инструменты отладки интерфейса
    default: op
