# VoidRP UI — настоящие интерфейсы на ванильном клиенте.
# Открытый код (MIT): https://void-rp.ru

pack:
  # Адрес, по которому раздаётся архив. Оставьте пустым — плагин раздаст его сам.
  # Заполняйте, только если хотите выложить plugins/VoidRpUI/voidrp-ui.zip куда-то ещё
  # (свой веб-сервер, CDN) или если сервер стоит за прокси.
  url: ""
  # Встроенная раздача пака: работает, пока url пуст.
  serve:
    enabled: true
    port: 8123
    # Имя хоста в ссылке. Пусто — берётся адрес, который ввёл сам игрок,
    # поэтому ссылка одинаково работает и в локальной сети, и снаружи.
    host: ""
  # Собирать второй пак для клиентов до 26.2.
  # В 26.2 Mojang переименовал файлы текстового шейдера, а пак называет их прямо, поэтому
  # одним архивом обе версии не накрыть. Плагин собирает оба и отдаёт каждому игроку свой:
  # версию клиента он берёт у PacketEvents, а без него сначала пробует новый пак и, если
  # клиент не смог его применить, досылает старый.
  legacy: true
  # Адрес второго пака — нужен, только если вы выкладываете архивы сами (заполнен url).
  legacy-url: ""
  # Отправлять пак при входе игрока.
  send-on-join: true
  # true = без пака на сервер не пустят.
  required: false
  # Не открывать страницы, пока клиент не принял пак. Выключайте, только если пак
  # применяется как-то иначе (через server.properties или свой собранный пак).
  require-accepted: true

# Как страница ложится на окно
display:
  # Форма экрана, под которую верстается страница, пока игрок не сказал свою.
  #
  # Холст всегда 1024 единицы в высоту — это вся высота окна при любом разрешении и любом
  # масштабе интерфейса. Ширина зависит от формы экрана: 1820 на 16:9, 1365 на 4:3, 2389
  # на 21:9. Единица квадратная всегда, поэтому ничего не сплющивается: страница просто
  # верстается под ширину, как сайт под ширину окна браузера.
  #
  # Узнать форму экрана у клиента нельзя — ванильный клиент её не отправляет. Поэтому
  # игрок сообщает её сам командой /vui screen 4:3 (запоминается в screens.yml), а до
  # этого используется значение отсюда. Ошибка не ломает страницу: важное всё равно
  # держится в центральной полосе 4:3, за её пределами живёт только фон и украшения.
  screen: "16:9"
  # Спрашивать формат экрана у игрока перед его самой первой страницей.
  #
  # Пять секунд один раз в жизни: игрок видит рамку по краям холста и жмёт формат, пока она
  # не сядет по краям экрана. После этого все страницы верстаются под его настоящее окно.
  # Выключите, если формат задаёте сами (например, все играют в одинаковых клиентах).
  ask-screen: true

# Лица игроков на страницах
heads:
  # Сохранять скины входящих игроков в plugins/VoidRpUI/heads/.
  # Скин берётся у самого игрока: сервер уже держит адрес его скина в профиле — у Mojang
  # для онлайн-режима, у вашего скин-плагина в любом другом. Никуда наружу мы не ходим.
  # Лицо попадает в пак при следующей его сборке, то есть после перезапуска плагина.
  collect: true

# Ввод
input:
  # Единиц холста на градус поворота. Больше — курсор быстрее.
  sensitivity: 10
  # Перерисовывать ли страницу, когда курсор наводится на другой элемент.
  # Страница — одна длинная строка, её отправка стоит десяток килобайт, и на каждом
  # пересечении карточки это чувствуется как рывок курсора. По умолчанию подсветка
  # рисуется на полосе курсора, а страница остаётся как есть.
  redraw-on-hover: false

# Звуки интерфейса. Пустое имя — без звука.
sound:
  click: "ui.button.click"
  hover: ""
  open: "block.note_block.hat"
  close: "block.note_block.bass"
  volume: 0.35
