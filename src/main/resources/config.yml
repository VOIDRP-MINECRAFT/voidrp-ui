# VoidRP UI — real interfaces on a vanilla client.
# Open source (MIT): https://github.com/VOIDRP-MINECRAFT/voidrp-ui

# Which set of words is written into messages.yml on this server's first run: en or ru.
# After that the file is yours — changing this will not overwrite it.
language: en

# Which look is written into theme.yml on this server's first run:
#   midnight — near-black with violet, the one in the screenshots
#   daylight — a light theme: pale page, dark ink, indigo accent
#   ember    — warm dark, charcoal and orange
#   grove    — dark green
# After the first run the file is yours; changing this will not paint over it. Making your
# own is a matter of editing theme.yml — see docs/theming.md.
theme: midnight

pack:
  # Where the archive is served from. Leave it empty and the plugin serves it itself.
  # Fill it in only to host plugins/VoidRpUI/voidrp-ui.zip somewhere else (your own web
  # server, a CDN), or when the server sits behind a proxy.
  url: ""
  # The built-in server: used while url is empty.
  serve:
    enabled: true
    port: 8123
    # The host name in the link. Empty means the address the player typed to get here, so
    # the link works the same on a local network and from the other side of the internet.
    host: ""
  # Build a second pack for clients older than 26.2.
  #
  # Mojang renamed the text shader files in 26.2 and a pack names them outright, so one
  # archive cannot cover both versions. The plugin builds both and hands each player the
  # one their client reads: the version comes from PacketEvents, and without it the modern
  # pack is tried first and the older one follows for anyone who could not apply it.
  legacy: true
  # The second pack's address — needed only when you host the archives yourself (url set).
  legacy-url: ""
  # Send the pack when a player joins.
  send-on-join: true
  # true = players cannot join without accepting the pack.
  required: false
  # Refuse to open pages until the client has accepted the pack. Turn this off only if the
  # pack is applied some other way (server.properties, or a merged pack of your own).
  require-accepted: true

# How a page sits on the window
display:
  # The screen shape a page is laid out for until the player says what theirs is.
  #
  # The canvas is always 1024 units tall — the whole height of the window, at any
  # resolution and any GUI scale. The width follows the shape of the screen: 1820 on 16:9,
  # 1365 on 4:3, 2389 on 21:9. A unit is always square, so nothing is ever squashed: the
  # page is simply laid out for the width, the way a web page is for a browser window.
  #
  # The shape cannot be read from the client — a vanilla client never sends it. So the
  # player says it themselves with /vui screen 4:3 (kept in screens.yml), and until they
  # do, this is what is assumed. Getting it wrong does not break a page: everything that
  # matters stays inside the central 4:3 band, and only background and decoration live
  # outside it.
  screen: "16:9"
  # Ask a player what shape their screen is before their very first page.
  #
  # Five seconds, once in their life: they see a frame on the edge of the canvas and press
  # shapes until it sits on the edges of their screen. Every page after that is laid out
  # for the window they actually have. Turn it off if you set the shape yourself (everyone
  # on identical clients, say).
  ask-screen: true

# Players' faces on pages
heads:
  # Save the skins of joining players into plugins/VoidRpUI/heads/.
  #
  # The skin comes from the player: the server already holds the address of it on their
  # profile — Mojang's in online mode, your skin plugin's in any other. Nothing here calls
  # anything outside. The face enters the pack the next time it is built, which is when the
  # plugin restarts.
  collect: true

# What moves by itself
effects:
  # Drifting specks behind a page.
  #
  # A page is sent once and then sits still — which is right for a page and wrong for a
  # background. So a speck carries a marker of its own and the shader works out where it is
  # from the time of day: the whole field moves at your client's frame rate and costs
  # nothing after the page is sent. No frames, no packets, no server thread.
  #
  # It asks the text shader for one thing more than it otherwise would — the client's own
  # globals, where the time of day lives. If a client will not have that, it refuses the
  # whole pack rather than that one line, which is why this starts off: turn it on, open a
  # page, and see. With it off the same specks are drawn as a still field and the shader is
  # left exactly as it was.
  particles: false

# Input
input:
  # Canvas units per degree of turn. Higher means a faster cursor.
  sensitivity: 10
  # How many gaps between readings the pointer is given to cover the distance one shows.
  #
  # The client says where it is looking twenty times a second; between two of those the
  # pointer walks the distance at one pace instead of jumping most of it at once. This is
  # how long it is given for the walk, counted in those gaps, and it is the one number here
  # worth turning:
  #
  #   1.0  the pointer arrives exactly as the next reading is due — as close to the hand as
  #        this can get, at the cost of a stub of a frame at the end of every gap
  #   1.5  the default: nothing is worse than it was and every part of the smoothness is
  #        better
  #   2.0  every frame of a gap the same size, and the pointer noticeably further behind
  #
  # Measured against a recording of a real hand, the pointer sits 63 units from it at 1.0,
  # 90 at 1.5 and 108 at 1.8, while the largest jump between two frames goes the other way:
  # 452, 144, 121.
  smoothing: 1.5
  # How often the pointer is drawn, in frames a second.
  #
  # The client reports where it is looking twenty times a second, and that is the ceiling on
  # knowing where the pointer is — not on drawing it. Between two readings the pointer is
  # reckoned forward, and the more often that is sent the smaller the step from one position
  # to the next. Each frame is one small packet per player with a page open.
  frame-rate: 85
  # Whether the page is drawn again when the cursor moves onto something else.
  #
  # A page is one long line; sending it costs tens of kilobytes, and doing that every time
  # the cursor crosses a card is felt as the cursor stuttering. By default the highlight is
  # drawn on the cursor's own bar and the page stays as it is.
  redraw-on-hover: false
  # Keep other plugins' boss bars off the screen while a page is open.
  #
  # A page rides a boss bar, and bars stack in the order the client first saw them — so a
  # bar another plugin was already showing would push the page a line down, and anything
  # below it would be drawn across the page. With PacketEvents installed, other bars are
  # held back while a page is open, the way the game's own menus cover the HUD, and come
  # back when it closes exactly as they are by then: a timer that ticked on while the page
  # was open is shown at its new value. The owning plugin is never told.
  bar-priority: true

# Interface sounds. An empty name means silence.
sound:
  click: "ui.button.click"
  hover: ""
  open: "block.note_block.hat"
  close: "block.note_block.bass"
  volume: 0.35
