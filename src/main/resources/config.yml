# VoidRP UI — настоящие интерфейсы на ванильном клиенте.
# Открытый код (MIT): https://void-rp.ru

pack:
  # Адрес, по которому раздаётся архив. Оставьте пустым — плагин раздаст его сам.
  # Заполняйте, только если хотите выложить plugins/VoidRpUI/voidrp-ui.zip куда-то ещё
  # (свой веб-сервер, CDN) или если сервер стоит за прокси.
  url: ""
  # Встроенная раздача пака: работает, пока url пуст.
  serve:
    enabled: true
    port: 8123
    # Имя хоста в ссылке. Пусто — берётся адрес, который ввёл сам игрок,
    # поэтому ссылка одинаково работает и в локальной сети, и снаружи.
    host: ""
  # Отправлять пак при входе игрока.
  send-on-join: true
  # true = без пака на сервер не пустят.
  required: false
  # Не открывать страницы, пока клиент не принял пак. Выключайте, только если пак
  # применяется как-то иначе (через server.properties или свой собранный пак).
  require-accepted: true

# Как страница ложится на окно
display:
  # false — растягивать на весь экран (по умолчанию: страница всегда достаёт до краёв,
  #         но на окне не 16:9 круги слегка овальные).
  # true  — сохранять пропорции: ничего не искажается, по краям остаются поля.
  keep-proportions: false

# Лица игроков на страницах
heads:
  # Сохранять скины входящих игроков в plugins/VoidRpUI/heads/.
  # Скин берётся у самого игрока: сервер уже держит адрес его скина в профиле — у Mojang
  # для онлайн-режима, у вашего скин-плагина в любом другом. Никуда наружу мы не ходим.
  # Лицо попадает в пак при следующей его сборке, то есть после перезапуска плагина.
  collect: true

# Ввод
input:
  # Единиц холста на градус поворота. Больше — курсор быстрее.
  sensitivity: 10
  # Перерисовывать ли страницу, когда курсор наводится на другой элемент.
  # Страница — одна длинная строка, её отправка стоит десяток килобайт, и на каждом
  # пересечении карточки это чувствуется как рывок курсора. По умолчанию подсветка
  # рисуется на полосе курсора, а страница остаётся как есть.
  redraw-on-hover: false

# Звуки интерфейса. Пустое имя — без звука.
sound:
  click: "ui.button.click"
  hover: ""
  open: "block.note_block.hat"
  close: "block.note_block.bass"
  volume: 0.35
